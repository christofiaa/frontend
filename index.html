<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор с историей</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <div class="expression" id="expression">0</div>
                <div class="result" id="result">0</div>
            </div>
            <div class="buttons">
                <button class="btn func" data-action="clear">C</button>
                <button class="btn func" data-action="backspace"><i class="fas fa-backspace"></i></button>
                <button class="btn func" data-action="percent">%</button>
                <button class="btn op" data-op="^">^</button>

                <button class="btn num" data-num="7">7</button>
                <button class="btn num" data-num="8">8</button>
                <button class="btn num" data-num="9">9</button>
                <button class="btn op" data-op="/">/</button>

                <button class="btn num" data-num="4">4</button>
                <button class="btn num" data-num="5">5</button>
                <button class="btn num" data-num="6">6</button>
                <button class="btn op" data-op="*">×</button>

                <button class="btn num" data-num="1">1</button>
                <button class="btn num" data-num="2">2</button>
                <button class="btn num" data-num="3">3</button>
                <button class="btn op" data-op="-">-</button>

                <button class="btn num" data-num="0">0</button>
                <button class="btn" data-action="dot">.</button>
                <button class="btn equals" id="equals">=</button>
                <button class="btn op" data-op="+">+</button>
            </div>
            <div class="calculator-header">
                <h1>NeoCalculator</h1>
                <div class="calculator-meta">
                    <span>v1.0</span>
                    <span>•</span>
                    <span>Premium</span>
                </div>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <h3><i class="fas fa-history"></i> История вычислений</h3>
                <button class="btn-small" id="clear-history">Очистить</button>
            </div>
            <ul id="history-list">
                <!-- История будет здесь -->
            </ul>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="history.js"></script>
    <script src="script.js"></script>
</body>
</html>
